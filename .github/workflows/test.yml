name: Test
on:
  push:
    branches:
      - master
  pull_request:
env:
  FORCE_COLOR: 2
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.matrix.outputs.node_versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - id: matrix
        run: node .github/scripts/get-node-matrix.js
  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.discover.outputs.node_versions) }}
    name: Node.js ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ matrix.node-version }}
      - run: pnpm test
